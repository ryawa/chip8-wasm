<!DOCTYPE html>
<html>
    <head>
        <title>chip8-wasm</title>
        <style>
            kbd > kbd {
                border-radius: 3px;
                padding: 10px;
                border: 1px solid black;
                display: inline-block;
            }
        </style>
    </head>
    <body style="font-family: monospace;">
        <div style="display: flex; gap: 20px; margin-bottom: 5px;">
            <canvas id="canvas" width="640" height="320"></canvas>
            <div style="display: grid; place-items: center;">
                <table style="table-layout: auto; width: max-content;">
                    <tbody>
                        <tr>
                            <td><kbd><kbd id="Digit1">1</kbd></kbd></td>
                            <td><kbd><kbd id="Digit2">2</kbd></kbd></td>
                            <td><kbd><kbd id="Digit3">3</kbd></kbd></td>
                            <td><kbd><kbd id="Digit4">C</kbd></kbd></td>
                        </tr>
                        <tr>
                            <td><kbd><kbd id="KeyQ">4</kbd></kbd></td>
                            <td><kbd><kbd id="KeyW">5</kbd></kbd></td>
                            <td><kbd><kbd id="KeyE">6</kbd></kbd></td>
                            <td><kbd><kbd id="KeyR">D</kbd></kbd></td>
                        </tr>
                        <tr>
                            <td><kbd><kbd id="KeyA">7</kbd></kbd></td>
                            <td><kbd><kbd id="KeyS">8</kbd></kbd></td>
                            <td><kbd><kbd id="KeyD">9</kbd></kbd></td>
                            <td><kbd><kbd id="KeyF">E</kbd></kbd></td>
                        </tr>
                        <tr>
                            <td><kbd><kbd id="KeyZ">A</kbd></kbd></td>
                            <td><kbd><kbd id="KeyX">0</kbd></kbd></td>
                            <td><kbd><kbd id="KeyC">B</kbd></kbd></td>
                            <td><kbd><kbd id="KeyV">F</kbd></kbd></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; width: 640px;">
            <input type="file" id="file-input" accept=".ch8"/>
            <div>
                <button id="start" type="button">Start</button>
                <button id="stop" type="button">Stop</button>
                <button id="step" type="button">Step</button>
                <button id="reset" type="button">Reset</button>
            </div>
        </div>
        <br/>
        <br/>
        <div style="display: flex; gap: 20px; height: 400px;">
            <div id="instructions" style="overflow: auto; padding-right: 5px;"></div>
            <div id="memory" style="overflow: auto; padding-right: 5px; width: max-content;"></div>
            <div id="registers">
                PC:</br>
                I:</br>
                DT:</br>
                ST:</br>
                V0: 0000<br/>
                V1: 0000<br/>
                V2: 0000<br/>
                V3: 0000<br/>
                V4: 0000<br/>
                V5: 0000<br/>
                V6: 0000<br/>
                V7: 0000<br/>
                V8: 0000<br/>
                V9: 0000<br/>
                VA: 0000<br/>
                VB: 0000<br/>
                VC: 0000<br/>
                VD: 0000<br/>
                VE: 0000<br/>
                VF: 0000<br/>
            </div>
            <div id="stack">
                <span style="background: yellow;">0000</span><br/>
            </div>
        </div>
        <script type="module" src="wasm.js"></script>
    </body>
</html>
