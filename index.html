<!DOCTYPE html>
<html>
    <head><title>chip8-wasm</title></head>
    <body style="font-family: monospace;">
        <div style="display: flex; gap: 20px; margin-bottom: 5px;">
            <canvas id="canvas" width="640" height="320"></canvas>
            <div id="instructions" style="height: 320px; overflow: auto; padding-right: 5px;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; width: 640px;">
            <input type="file" id="file-input" accept=".ch8"/>
            <div>
                <button id="start" type="button">Start</button>
                <button id="stop" type="button">Stop</button>
                <button id="step" type="button">Step</button>
                <button id="reset" type="button">Reset</button>
            </div>
        </div>
        <br/>
        <div id="memory" style="height: 400px; overflow: auto; padding-right: 5px; width: max-content;"></div>
        <br/>
        <div style="display: flex; gap: 20px;">
            <div id="registers">
                PC:</br>
                I:</br>
                DT:</br>
                ST:</br>
                V0: 0000<br/>
                V1: 0000<br/>
                V2: 0000<br/>
                V3: 0000<br/>
                V4: 0000<br/>
                V5: 0000<br/>
                V6: 0000<br/>
                V7: 0000<br/>
                V8: 0000<br/>
                V9: 0000<br/>
                VA: 0000<br/>
                VB: 0000<br/>
                VC: 0000<br/>
                VD: 0000<br/>
                VE: 0000<br/>
                VF: 0000<br/>
            </div>
            <div id="stack">
                <span style="background: yellow;">0000</span><br/>
            </div>
        </div>
        <script type="module" src="wasm.js"></script>
    </body>
</html>
